# Claude Timer-dashboard: én fane per konto plus en oversigt med alle konti.
#
# Indsæt via Indstillinger → Dashboards → Tilføj dashboard → ⋮ → Rediger →
# ⋮ → Rå konfigurationseditor. Fanerne bygges automatisk ud fra integrationens
# konti, så nye konti og nye grænser (fx en ny model) dukker op af sig selv.
#
# På hver fane skifter du mellem kort og målere i selve kortet, og knappen ⟳
# henter data igen med det samme. Valget huskes per fane i browseren.
#
# Valgfrit:
#   view: gauges        # start på målere i stedet for kort
#   hours_to_show: 48   # historikkens længde (standard 168 = en uge)
#
# Vil du selv redigere fanerne, så vælg ⋮ → "Tag kontrol" i dashboardet. Så
# omdannes det til almindelige kort med custom:claude-timer-card.
strategy:
  type: custom:claude-timer
