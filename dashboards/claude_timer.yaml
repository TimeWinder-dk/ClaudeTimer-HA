# Claude Timer-dashboard med to visninger, som i Windows-appen: "Kort" og "Målere".
#
# Indsæt via Indstillinger → Dashboards → Tilføj dashboard → ⋮ → Rediger →
# ⋮ → Rå konfigurationseditor. Kortet (custom:claude-timer-card) følger med
# integrationen og finder selv alle grænser, også nye modeller.
#
# Valgfrit på kortet:
#   limits: [session, weekly]   # kun bestemte grænser
#   device_id: <id>             # kun én konto, hvis du har flere
title: Claude
views:
  - title: Kort
    path: kort
    icon: mdi:card-text-outline
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:claude-timer-card
            view: cards
          - type: history-graph
            title: Forbrug over tid
            hours_to_show: 168
            entities:
              - entity: sensor.claude_timer_session_usage
              - entity: sensor.claude_timer_weekly_usage
              - entity: sensor.claude_timer_weekly_forecast

  - title: Målere
    path: maalere
    icon: mdi:gauge
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:claude-timer-card
            view: gauges
          - type: history-graph
            title: Forbrug over tid
            hours_to_show: 168
            entities:
              - entity: sensor.claude_timer_session_usage
              - entity: sensor.claude_timer_weekly_usage
              - entity: sensor.claude_timer_weekly_forecast
